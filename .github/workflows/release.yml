name: Release image

# Deliberate releases only: push a version tag (v0.4.0) and this builds the multi-arch
# image ONCE and publishes it to two registries:
#   GHCR        ghcr.io/mytview/mytview:<version> + :latest  (THE address: every doc, compose
#                example and new listing points here, so the image lives under the project's own
#                GitHub organisation)
#   Docker Hub  fbartolini/mytview:<version> + :latest   (a mirror, same digest, kept so installs
#                made before 2026-11 keep receiving updates; no longer named in any documentation)
# GHCR uses the workflow's own GITHUB_TOKEN (packages: write below); the package lands under the
# org that owns this repo and must be set to PUBLIC once, in the package's settings on GitHub,
# after the first push. Docker Hub requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an
# access token, not the account password).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mytview/mytview:latest
            ghcr.io/mytview/mytview:${{ steps.v.outputs.version }}
            fbartolini/mytview:latest
            fbartolini/mytview:${{ steps.v.outputs.version }}
