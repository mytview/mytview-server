name: Release image

# Deliberate releases only: push a version tag (v0.4.0) and this builds the multi-arch
# image ONCE and publishes it to two registries:
#   Docker Hub  fbartolini/mytview:<version> + :latest   (the address every doc and template uses)
#   GHCR        ghcr.io/mytview/mytview:<version> + :latest  (mirror: TrueNAS' catalog prefers ghcr,
#                and it sidesteps Docker Hub pull limits for NAS users; same digest as Docker Hub)
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token, not the
# account password). GHCR uses the workflow's own GITHUB_TOKEN (packages: write below); the
# package lands under the org that owns this repo and must be set to PUBLIC once, in the
# package's settings on GitHub, after the first push.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fbartolini/mytview:latest
            fbartolini/mytview:${{ steps.v.outputs.version }}
            ghcr.io/mytview/mytview:latest
            ghcr.io/mytview/mytview:${{ steps.v.outputs.version }}
